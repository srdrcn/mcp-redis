# The two Secrets redis-mcp needs. This file holds placeholders only and is not part of the kustomization, so real
# passwords never end up in the repository: fill in a copy (*.local.yaml is git-ignored) and apply it.
#
#   cp deploy/openshift/secret.yaml deploy/openshift/secret.local.yaml
#   # replace every <...>; the API key e.g. from: openssl rand -hex 32
#   oc apply -f deploy/openshift/secret.local.yaml
#
# After a change: oc apply again, then oc rollout restart deployment/redis-mcp (the values are read at startup).
apiVersion: v1
kind: Secret
metadata:
  name: redis-mcp-passwords
type: Opaque
# One key per cluster of configmap.yaml: <cluster name>_pass = the password of that cluster's username. Mounted at
# /etc/redis-mcp/passwords, one file per key. A cluster without a key connects without AUTH (the log warns).
stringData:
  cbdevrds_pass: "<password>"
  cbtstrds_pass: "<password>"
  cbprdrds_pass: "<password>"
  cbsbxrds_pass: "<password>"
  # The Sentinel cluster cbuatrds: the password of its Redis user, and the Sentinels' own password (only if they
  # require one).
  # cbuatrds_pass: "<password>"
  # cbuatrds_sentinel_pass: "<password>"
---
apiVersion: v1
kind: Secret
metadata:
  name: redis-mcp-api-key
type: Opaque
# The key HTTP clients send in the X-Authorization header (REDIS_MCP_API_KEY in deployment.yaml). The server does
# not start while it is still a <...> placeholder.
stringData:
  api-key: "<api-key>"
