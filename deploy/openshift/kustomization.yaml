apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# secret.yaml (the Secrets redis-mcp-passwords and redis-mcp-api-key) is deliberately not listed: fill in a copy
# (secret.local.yaml, git-ignored) and `oc apply -f` it, so real passwords never sit in the repository.
resources:
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - route.yaml
labels:
  - pairs:
      app.kubernetes.io/name: redis-mcp
      app.kubernetes.io/component: mcp-server
    includeSelectors: false
# The image .github/workflows/docker-push.yml publishes (latest = main, X.Y.Z = tag vX.Y.Z, sha-<commit>).
# For an image built inside the cluster use image-registry.openshift-image-registry.svc:5000/<namespace>/redis-mcp.
images:
  - name: redis-mcp
    newName: docker.io/chosenwar/redis-mcp
    newTag: latest
